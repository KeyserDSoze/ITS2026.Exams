name: exam-framework-ci

on:
  push:
  pull_request:

jobs:
  common:
    name: Common / public boundary / private extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { throw 'PowerShell parse errors found.' }
      - name: Enforce public repository boundary
        shell: pwsh
        run: ./tests/test-public-boundary.ps1
      - name: Test discovery and question scoring
        shell: pwsh
        run: ./tests/test-common.ps1
      - name: Test private grader extension contract
        shell: pwsh
        run: ./tests/test-private-extension.ps1

  development:
    name: Development reference case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run behavioral DEV grader tests
        shell: pwsh
        run: ./src/dev/sample/tests/test-dev-grader.ps1
      - name: Test twelve .NET 10 practice cases
        shell: pwsh
        run: ./src/dev/practice/tests/test-practice-grader.ps1

  infrastructure-simulated:
    name: Infrastructure scoring fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run INFRA simulated grader tests
        shell: pwsh
        run: ./src/infra/sample/tests/test-infra-grader.ps1

  infrastructure-real:
    name: Infrastructure real IIS integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference Windows/IIS configuration
        shell: powershell
        run: ./src/infra/sample/solution/Apply-Solution.ps1
      - name: Grade real Windows/IIS state
        shell: powershell
        run: |
          $json = (& ./src/infra/sample/grader/grade-infra.ps1 -ExamRoot ./src/infra/sample/candidate -Json | Select-Object -Last 1)
          $result = $json | ConvertFrom-Json
          Write-Host $json
          if ($result.score -ne 20) { throw "Real INFRA reference solution must score 20/20, got $($result.score)." }

  usb-e2e:
    name: USB / reports / batch end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute operational tools end-to-end
        shell: powershell
        run: ./tests/test-usb-e2e.ps1

  packages:
    name: Build public reference packages
    runs-on: windows-latest
    needs: [common, development, infrastructure-simulated, infrastructure-real, usb-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP packages
        shell: powershell
        run: ./tools/build-packages.ps1
      - name: Verify generated ZIPs and required files
        shell: powershell
        run: |
          $expected = @('DEV-SAMPLE-CANDIDATO.zip','INFRA-SAMPLE-CANDIDATO.zip','USB-CORRETTORE.zip') +
                      @(1..12 | ForEach-Object { 'DEV-{0:D3}-SAMPLE-CANDIDATO.zip' -f $_ })
          foreach ($name in $expected) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path $path)) { throw "Missing package: $name" }
            if ((Get-Item $path).Length -le 0) { throw "Empty package: $name" }
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP 'exam-package-verification'
          Remove-Item -Recurse -Force $verifyRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null

          $dev = Join-Path $verifyRoot 'dev'
          $infra = Join-Path $verifyRoot 'infra'
          $usb = Join-Path $verifyRoot 'usb'
          Expand-Archive dist/DEV-SAMPLE-CANDIDATO.zip $dev
          Expand-Archive dist/INFRA-SAMPLE-CANDIDATO.zip $infra
          Expand-Archive dist/USB-CORRETTORE.zip $usb

          if (-not (Test-Path (Join-Path $dev '.exam-id'))) { throw 'DEV package lost .exam-id marker.' }
          if (-not (Test-Path (Join-Path $infra '.exam-id'))) { throw 'INFRA package lost .exam-id marker.' }
          foreach ($number in 1..12) {
            $id='DEV-{0:D3}-SAMPLE' -f $number
            $target=Join-Path $verifyRoot $id
            Expand-Archive "dist/$id-CANDIDATO.zip" $target
            if (-not (Test-Path (Join-Path $target '.exam-id'))) { throw "Missing training marker: $id" }
            $marker=(Get-Content -Raw (Join-Path $target '.exam-id')).Trim()
            if (-not $marker.StartsWith("$id|")) { throw "Wrong marker in $id" }
          }
          foreach ($required in @('CORREZIONE.cmd','grade-exam.ps1','grade-questions.ps1','PREPARE-EXAM.ps1','grade-batch.ps1')) {
            if (-not (Test-Path (Join-Path $usb "tools/$required"))) { throw "USB package missing $required." }
          }
          if (-not (Test-Path (Join-Path $usb 'src/dev/sample/grader/grade-dev.ps1'))) { throw 'USB package missing DEV grader.' }
          $folders=@(Get-ChildItem 'src/dev/practice' -Directory | Where-Object { $_.Name -match '^[0-9]{3}_' })
          if ($folders.Count -ne 12) { throw 'Expected twelve training folders.' }
          foreach ($folder in $folders) {
            if (-not (Test-Path (Join-Path $usb "src/dev/practice/$($folder.Name)/grader/grade.ps1"))) { throw "Missing $($folder.Name) grader in USB." }
          }
          if (-not (Test-Path (Join-Path $usb 'tools/grade-dev-practice.ps1'))) { throw 'Missing common DEV grader in USB.' }
          if (-not (Test-Path (Join-Path $usb 'src/infra/sample/grader/grade-infra.ps1'))) { throw 'USB package missing INFRA grader.' }
      - uses: actions/upload-artifact@v4
        with:
          name: exam-framework-reference-packages
          path: dist/*.zip
          if-no-files-found: error
