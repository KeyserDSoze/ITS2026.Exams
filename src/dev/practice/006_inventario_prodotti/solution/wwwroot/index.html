<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario prodotti — esercitazione .NET 10</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>Inventario prodotti</h1>
    <p id="helper" class="helper">Inserisci un elemento e controlla il risultato qui sotto.</p>
    <form id="entry-form">
      <label for="name">Name<input id="name" name="name" required></label>

      <button type="submit">Aggiungi</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <ul id="entries"></ul>
  </main>
</body>
</html>
