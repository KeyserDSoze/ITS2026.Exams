<!doctype html>
<html lang="it">
<head>

  <title>Bacheca annunci — esercitazione .NET 10</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>Bacheca annunci</h1>

    <ul id="entries"></ul>
