<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bacheca annunci — esercitazione .NET 10</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>Bacheca annunci</h1>
    <p id="helper" class="helper">Inserisci un elemento e controlla il risultato qui sotto.</p>
    <form id="entry-form">
      <label for="title">Title<input id="title" name="title" required></label>

      <button type="submit">Aggiungi</button>
    </form>
    <label class="search-label" for="search">Cerca per titolo</label>
    <input id="search" type="search" placeholder="Filtra gli annunci">
    <p id="message" role="status" aria-live="polite"></p>
    <ul id="entries"></ul>
  </main>
</body>
</html>
